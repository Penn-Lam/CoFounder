<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var requests3D = params.get('experience') === '3d';
      var smallViewport = window.innerWidth < 768;
      var coarsePointer = window.matchMedia('(pointer: coarse)').matches;

      if (!requests3D && (smallViewport || coarsePointer)) {
        var destination = new URL('/desktop/', window.location.origin);
        var invitation = window.location.pathname.match(/^\/invite\/([^/]+)$/);
        destination.searchParams.set('entry', 'mobile');
        if (invitation) destination.searchParams.set('invite', invitation[1]);
        window.location.replace(destination.toString());
      }
    })();
  </script>
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>AI Cofounder Diagnostics</title>
  <meta name="title" content="AI Cofounder Diagnostics">
  <meta name="description" content="两个人放在一起，会形成一家什么样的公司？AI 创业合伙人压力测试。">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI Cofounder Diagnostics">
  <meta property="og:description" content="两个人放在一起，会形成一家什么样的公司？">

  <!-- Twitter -->


  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">

  <meta property="twitter:title" content="AI Cofounder Diagnostics">
  <meta name="twitter:title" content="AI Cofounder Diagnostics">

  <meta property="twitter:description" content="两个人放在一起，会形成一家什么样的公司？">
  <meta name="twitter:description" content="两个人放在一起，会形成一家什么样的公司？">

  <!-- Images -->
  <meta property="og:image" content="../static/images/preview-new.jpg">

  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">

</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>

</body>

</html>
